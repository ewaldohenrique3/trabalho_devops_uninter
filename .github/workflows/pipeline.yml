name: CI Docker Pipeline

on:
  push:
    branches: [ "main", "master" ]  # Dispara a cada push na branch main ou master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Verificar se os arquivos essenciais do site existem
        run: |
          echo "Verificando se os arquivos do site estão presentes..."
          
          # Lista de arquivos obrigatórios baseada na sua pasta public
          ARQUIVOS="public/index.html public/info.html public/integrantes.html public/css/style.css"
          
          for arquivo in $ARQUIVOS; do
            if [ ! -f "$arquivo" ]; then
              echo "ERRO CRÍTICO: O arquivo obrigatório '$arquivo' não foi encontrado!"
              exit 1
            else
              echo "OK: $arquivo encontrado com sucesso."
            fi
          done

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false   # Apenas cria a imagem para teste
          load: true    # Carrega a imagem no ambiente do runner
          tags: mosqueteiros-site:latest

      - name: Testar se o container sobe e responde
        run: |
          docker run -d -p 8080:80 --name trabalho-teste mosqueteiros-site:latest
          sleep 3
          # Faz um teste HTTP para garantir que o Nginx está respondendo na porta 8080
          curl --fail http://localhost:8080 || exit 1